
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Notes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>My Notes</h1>
    <p>Write your thoughts below. Your draft saves automatically.</p>

    <label for="note-text">Your note</label>
    <textarea
      id="note-text"
      maxlength="200"
      rows="10"
      placeholder="Start writing your note..."
    ></textarea>

    <div class="counters" aria-live="polite">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <div class="actions">
      <button id="clear-btn" type="button">Clear note</button>
      <button id="theme-toggle" type="button">Dark mode</button>
    </div>
  </main>
</body>
</html>
