<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fetch and filter users from the JSONPlaceholder demo API.">
  <title>Day 5 — Fetch Users</title>
  <style>
    :root { color-scheme: light; --ink: #20283b; --muted: #68738a; --accent: #5b55d6; --line: #e4e8f1; --surface: #fff; --background: #f5f7fc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(900px, calc(100% - 32px)); margin: 48px auto; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.045em; }
    .intro { max-width: 620px; margin: 12px 0 26px; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 10px 30px #24335b0b; }
    .field { flex: 1 1 240px; }
    label { display: block; margin-bottom: 7px; font-size: .88rem; font-weight: 700; }
    input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cbd2e1; border-radius: 9px; background: white; color: var(--ink); font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #b8b5ff; outline-offset: 2px; }
    button { min-height: 44px; padding: 10px 17px; border: 0; border-radius: 9px; background: var(--accent); color: white; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover:not(:disabled) { background: #4540b9; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 1.6em; margin: 18px 2px; color: var(--muted); font-size: .92rem; }
    #status[data-state="error"] { color: #b42336; }
    #status[data-state="success"] { color: #18734a; }
    #users-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
    .user-card { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 7px 22px #24335b08; }
    .user-card h2 { margin: 0 0 10px; font-size: 1.12rem; overflow-wrap: anywhere; }
    .user-card p { margin: 6px 0 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .user-card strong { color: var(--ink); }
    @media (max-width: 600px) { main { margin: 28px auto; } #users-list { grid-template-columns: 1fr; } .controls { padding: 16px; } .controls button { width: 100%; } }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Web Foundations · Day 5</p>
    <h1>Meet the users</h1>
    <p class="intro">Load sample users from JSONPlaceholder, then filter the list by name. Filtering works on the users already loaded, so it does not send another request.</p>

    <section class="controls" aria-label="Load and filter users">
      <button id="load-users" type="button">Load users</button>
      <div class="field">
        <label for="filter-input">Filter users by name</label>
        <input id="filter-input" type="search" placeholder="Try “Leanne”…" autocomplete="off">
      </div>
    </section>

    <p id="status" role="status" aria-live="polite">Select “Load users” to fetch the user list.</p>
    <ul id="users-list" aria-label="Users"></ul>
  </main>
</body>
</html>
